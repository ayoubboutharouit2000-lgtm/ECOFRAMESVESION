<script>
/*
 * Timeline (seconds). Fully deterministic: render(t) draws any instant, so the
 * same file plays live and exports frame-exact video (?t=1.234).
 *
 *   0.00–0.50  placeholder O's sit still
 *   0.50       reels kick back slightly (anticipation), then spin
 *   ~2.00      ECO lands on the eye, overshoots a hair and bounces back
 *   ~2.15      VISION lands a beat later
 *   2.50–3.00  the finished logo holds, perfectly sharp
 */
const PITCH = 170;
const DURATION = 3.0;
const REELS = {
  eco:    { land: 29,    start: 0.5, stop: 2.00 },
  vision: { land: 35, start: 0.5, stop: 2.15 },
};
const KICK = 0.14;        // s, anticipation pull-back
const KICK_DIST = 0.16;   // cells
const OVERSHOOT = 0.12;   // cells past the eye before springing back
const SETTLE = 0.30;      // s, bounce-back

// Reel offset in px at time t (positive = strip moved down; symbol k is centred at k * PITCH).
function offset(r, t) {
  const target = r.land * PITCH;
  const back = -KICK_DIST * PITCH;
  const spinStart = r.start + KICK;
  if (t <= r.start) return 0;
  if (t < spinStart) {                       // ease back against the spin direction
    const u = (t - r.start) / KICK;
    return back * Math.sin(u * Math.PI / 2);
  }
  if (t < r.stop) {                          // spin: full speed at once, long mechanical slow-down
    const u = (t - spinStart) / (r.stop - spinStart);
    const e = 1 - Math.pow(1 - u, 3.4);
    return back + (target + OVERSHOOT * PITCH - back) * e;
  }
  if (t < r.stop + SETTLE) {                 // damped bounce back onto the eye
    const u = (t - r.stop) / SETTLE;
    return target + OVERSHOOT * PITCH * Math.exp(-5 * u) * Math.cos(u * Math.PI * 2.5);
  }
  return target;
}

const els = {};
for (const name of Object.keys(REELS)) {
  els[name] = {
    reel: document.getElementById('reel-' + name),
    eye: document.getElementById('eye-' + name),
    strip: document.querySelector('#reel-' + name + ' .strip'),
    blur: document.querySelector('#blur-' + name + ' .blur'),
    s0: document.querySelector('#fade-' + name + ' .s0'),
    s1: document.querySelector('#fade-' + name + ' .s1'),
    s2: document.querySelector('#fade-' + name + ' .s2'),
    s3: document.querySelector('#fade-' + name + ' .s3'),
  };
}

function render(t) {
  for (const [name, r] of Object.entries(REELS)) {
    const e = els[name];
    const done = t >= r.stop + SETTLE;
    // Settled: show the static eye (identical geometry), so the end frame is exactly the logo.
    e.reel.style.display = done ? 'none' : '';
    e.eye.style.display = done ? '' : 'none';
    if (done) continue;
    const o = offset(r, t);
    // Speed (px per 1/60 s) drives the motion blur and the soft fade at the window's top and bottom.
    const speed = Math.abs(offset(r, t) - offset(r, t - 1 / 60));
    const blur = Math.min(26, speed * 0.32);
    const fade = Math.min(0.32, speed / 160);
    e.strip.setAttribute('transform', `translate(0 ${o})`);
    e.blur.setAttribute('stdDeviation', `0 ${blur.toFixed(2)}`);
    e.s0.setAttribute('stop-opacity', fade > 0.001 ? 0 : 1);
    e.s3.setAttribute('stop-opacity', fade > 0.001 ? 0 : 1);
    e.s1.setAttribute('offset', fade.toFixed(3));
    e.s2.setAttribute('offset', (1 - fade).toFixed(3));
  }
}

const params = new URLSearchParams(location.search);
if (params.has('t')) {
  // Export mode: draw one frame and stop.
  document.body.classList.add('export');
  if (params.has('w')) document.documentElement.style.setProperty('--export-w', params.get('w') + 'px');
  render(parseFloat(params.get('t')));
} else {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const once = params.has('once');
  if (reduce) render(DURATION);
  else {
    let t0 = null;
    const loop = (now) => {
      if (t0 === null) t0 = now;
      let t = (now - t0) / 1000;
      if (once) t = Math.min(t, DURATION);
      else t %= DURATION;
      render(t);
      if (!once || t < DURATION) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}
</script>
